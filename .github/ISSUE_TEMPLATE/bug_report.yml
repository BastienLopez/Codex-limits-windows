name: Rapport de bug
description: Signaler un comportement reproductible de Codex Limits Windows
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Ne joins aucun jeton, cookie, fichier d’authentification, historique local brut ou sortie complète de `codex app-server`.
  - type: input
    id: app-version
    attributes:
      label: Version de Codex Limits Windows
      placeholder: 0.5.0
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Version du Codex CLI
      placeholder: codex --version
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Version de Windows
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Comportement observé
      description: Décris le problème sans information de compte.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Ouvrir…
        2. Cliquer…
        3. Observer…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
