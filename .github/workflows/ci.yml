name: ci

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify repository cleanliness
        shell: powershell
        run: |
          $forbidden = git ls-files | Where-Object {
            $_ -match '(^|/)(bin|obj|artifacts|TestResults)/' -or
            $_ -match '(\.bak($|[-.])|\.tmp$|\.temp$|~$)' -or
            $_ -match '\.(pfx|p12|pem|key)$'
          }
          if ($forbidden) {
            throw "Tracked generated, backup, temporary, or sensitive files:`n$($forbidden -join "`n")"
          }

      - name: Build, smoke tests, and standalone EXE
        shell: powershell
        run: .\scripts\publish-exe.ps1 -Runtime win-x64

      - name: Upload standalone release files
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Limits-Windows-win-x64
          path: |
            artifacts/release/*.exe
            artifacts/release/*.exe.sha256
            artifacts/release/*.zip
            artifacts/release/*.zip.sha256
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download standalone release files
        uses: actions/download-artifact@v4
        with:
          name: Codex-Limits-Windows-win-x64
          path: release-files

      - name: Create or update GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem -LiteralPath .\release-files -File |
            Where-Object { $_.Name -match '\.(exe|zip)(\.sha256)?$' } |
            ForEach-Object { $_.FullName }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Codex Limits Windows $tag" --generate-notes
          }
