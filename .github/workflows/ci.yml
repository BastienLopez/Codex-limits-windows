name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify repository cleanliness
        shell: powershell
        run: |
          $forbidden = git ls-files | Where-Object {
            $_ -match '(^|/)(bin|obj|artifacts|TestResults)/' -or
            $_ -match '(\.bak($|[-.])|\.tmp$|\.temp$|~$)' -or
            $_ -match '\.(pfx|p12|pem|key)$'
          }
          if ($forbidden) {
            throw "Tracked generated, backup, temporary, or sensitive files:`n$($forbidden -join "`n")"
          }

      - name: Build and smoke tests
        shell: powershell
        run: .\scripts\test.ps1

      - name: Publish self-contained Windows x64 build
        shell: powershell
        run: |
          dotnet publish .\src\CodexLimits.App\CodexLimits.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\artifacts\ci-win-x64

      - name: Upload CI build
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Limits-Windows-ci-win-x64
          path: artifacts/ci-win-x64
          if-no-files-found: error
