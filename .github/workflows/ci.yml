name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build CodexLimits.Windows.sln -c Release
      - run: dotnet run --project tests/CodexLimits.SmokeTests/CodexLimits.SmokeTests.csproj -c Release --no-build
